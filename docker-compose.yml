services:
  api:
    build: .
    ports:
      - '8000:8000'
    environment:
      # SQLite por ahora. Para PostgreSQL: levantar con
      # `--profile postgres` y usar
      # postgresql+psycopg://alquilometro:alquilometro@db:5432/alquilometro
      DATABASE_URL: sqlite:////data/alquilometro.db
    volumes:
      - datos_api:/data

  db:
    profiles: [postgres]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: alquilometro
      POSTGRES_PASSWORD: alquilometro
      POSTGRES_DB: alquilometro
    ports:
      - '5432:5432'
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alquilometro']
      interval: 5s
      retries: 10

volumes:
  datos_api:
  datos_pg:
