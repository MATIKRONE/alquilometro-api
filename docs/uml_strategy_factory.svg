<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, sans-serif">
  <defs>
    <marker id="abierta" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#0F1B2A" stroke-width="1.6"/>
    </marker>
  </defs>
  <style>
    .caja{fill:#fff;stroke:#0F1B2A;stroke-width:2}
    .nombre{font-size:22px;font-weight:700;fill:#0F1B2A}
    .estereo{font-size:15px;font-style:italic;fill:#5B6675}
    .miembro{font-size:17px;fill:#1F2A37;font-family:'DejaVu Sans Mono',monospace}
    .linea{stroke:#0F1B2A;stroke-width:2;fill:none}
    .rotulo{font-size:16px;font-weight:600;fill:#0F1B2A}
  </style>

  <!-- Clientes -->
  <rect x="40" y="95" width="360" height="585" rx="14" fill="#F4F6F8" stroke="#9AA4B2" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="220" y="128" text-anchor="middle" class="estereo" style="font-style:normal;font-weight:600">Clientes del patrón</text>

  <g>
    <rect x="60" y="160" width="320" height="170" rx="6" class="caja"/>
    <rect x="61" y="161" width="318" height="62" rx="5" fill="#E8ECF1"/>
    <text x="220" y="186" text-anchor="middle" class="estereo">«modelo»</text>
    <text x="220" y="212" text-anchor="middle" class="nombre">ContratoAlquiler</text>
    <line x1="60" y1="223" x2="380" y2="223" class="linea"/>
    <text x="78" y="252" class="miembro">- tipo_ajuste: str</text>
    <text x="78" y="278" class="miembro">- tasa / serie_codigo</text>
    <line x1="60" y1="292" x2="380" y2="292" class="linea"/>
    <text x="78" y="318" class="miembro">+ mecanismo(repo)</text>
  </g>

  <g>
    <rect x="60" y="460" width="320" height="170" rx="6" class="caja"/>
    <rect x="61" y="461" width="318" height="62" rx="5" fill="#E8ECF1"/>
    <text x="220" y="486" text-anchor="middle" class="estereo">«servicio»</text>
    <text x="220" y="512" text-anchor="middle" class="nombre">ServicioProyecciones</text>
    <line x1="60" y1="523" x2="380" y2="523" class="linea"/>
    <text x="78" y="552" class="miembro">- indices: repositorio</text>
    <text x="78" y="578" class="miembro">  de la base</text>
    <line x1="60" y1="592" x2="380" y2="592" class="linea"/>
    <text x="78" y="618" class="miembro">+ proyectar(...)</text>
  </g>

  <!-- Simple Factory -->
  <g>
    <rect x="560" y="60" width="520" height="140" rx="6" class="caja"/>
    <rect x="561" y="61" width="518" height="62" rx="5" fill="#FDF4DA"/>
    <text x="820" y="86" text-anchor="middle" class="estereo">«Simple Factory»</text>
    <text x="820" y="112" text-anchor="middle" class="nombre">FabricaMecanismoAjuste</text>
    <line x1="560" y1="123" x2="1080" y2="123" class="linea"/>
    <text x="580" y="152" class="miembro">+ crear(tipo, tasa, serie,</text>
    <text x="580" y="178" class="miembro">        repositorio): MecanismoAjuste</text>
  </g>

  <!-- Strategy -->
  <g>
    <rect x="560" y="355" width="520" height="170" rx="6" class="caja"/>
    <rect x="561" y="356" width="518" height="62" rx="5" fill="#E3F5F0"/>
    <text x="820" y="381" text-anchor="middle" class="estereo">«abstract» · Strategy</text>
    <text x="820" y="407" text-anchor="middle" class="nombre" style="font-style:italic">MecanismoAjuste</text>
    <line x1="560" y1="418" x2="1080" y2="418" class="linea"/>
    <text x="580" y="447" class="miembro">+ ajustar(monto_base, fecha_base,</text>
    <text x="580" y="473" class="miembro">    fecha_ajuste, periodicidad)</text>
    <text x="580" y="499" class="miembro">    : ResultadoAjuste</text>
  </g>

  <g>
    <rect x="460" y="650" width="340" height="132" rx="6" class="caja"/>
    <rect x="461" y="651" width="338" height="48" rx="5" fill="#E3F5F0"/>
    <text x="630" y="683" text-anchor="middle" class="nombre">AjusteFijo</text>
    <line x1="460" y1="699" x2="800" y2="699" class="linea"/>
    <text x="478" y="728" class="miembro">- tasa_porcentual</text>
    <text x="478" y="754" class="miembro">base × (1 + tasa)ⁿ</text>
  </g>

  <g>
    <rect x="850" y="650" width="340" height="132" rx="6" class="caja"/>
    <rect x="851" y="651" width="338" height="48" rx="5" fill="#E3F5F0"/>
    <text x="1020" y="683" text-anchor="middle" class="nombre">AjusteIndice</text>
    <line x1="850" y1="699" x2="1190" y2="699" class="linea"/>
    <text x="868" y="728" class="miembro">- serie, repositorio</text>
    <text x="868" y="754" class="miembro">base × (Iₜ ÷ I₀)</text>
  </g>

  <g>
    <rect x="1260" y="650" width="300" height="132" rx="6" class="caja"/>
    <rect x="1261" y="651" width="298" height="62" rx="5" fill="#E8ECF1"/>
    <text x="1410" y="676" text-anchor="middle" class="estereo">«interface»</text>
    <text x="1410" y="702" text-anchor="middle" class="nombre">RepositorioIndices</text>
    <line x1="1260" y1="713" x2="1560" y2="713" class="linea"/>
    <text x="1278" y="744" class="miembro">+ valor(serie, fecha)</text>
  </g>

  <!-- Relaciones -->
  <line x1="400" y1="160" x2="556" y2="160" class="linea" stroke-dasharray="8 6" marker-end="url(#abierta)"/>
  <text x="478" y="150" text-anchor="middle" class="rotulo">«pide»</text>

  <line x1="400" y1="440" x2="556" y2="440" class="linea" marker-end="url(#abierta)"/>
  <text x="478" y="430" text-anchor="middle" class="rotulo">«usa»</text>

  <line x1="820" y1="200" x2="820" y2="351" class="linea" stroke-dasharray="8 6" marker-end="url(#abierta)"/>
  <text x="834" y="284" class="rotulo">«crea»</text>

  <polygon points="820,525 806,549 834,549" fill="#fff" stroke="#0F1B2A" stroke-width="2"/>
  <polyline points="820,549 820,600 630,600 630,650" class="linea"/>
  <polyline points="820,600 1020,600 1020,650" class="linea"/>

  <line x1="1190" y1="716" x2="1256" y2="716" class="linea" marker-end="url(#abierta)"/>
  <text x="1223" y="704" text-anchor="middle" class="rotulo">lee</text>

  <!-- Leyenda -->
  <g font-size="16" font-weight="600">
    <rect x="1180" y="78" width="168" height="36" rx="18" fill="#E3F5F0" stroke="#2BB39A" stroke-width="2"/>
    <text x="1264" y="102" text-anchor="middle" fill="#0F1B2A">Strategy</text>
    <rect x="1360" y="78" width="200" height="36" rx="18" fill="#FDF4DA" stroke="#F2B632" stroke-width="2"/>
    <text x="1460" y="102" text-anchor="middle" fill="#0F1B2A">Simple Factory</text>
  </g>
  <text x="1180" y="150" font-size="16" fill="#5B6675">Un mecanismo nuevo =</text>
  <text x="1180" y="174" font-size="16" fill="#5B6675">una clase + una rama en la fábrica.</text>
</svg>
