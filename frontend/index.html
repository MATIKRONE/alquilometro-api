<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1726">
  <title>Alquilómetro · Costos y contratos</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="top"><div class="wrap top-inner">
    <a class="brand" href="#buscar"><span class="mark" aria-hidden="true"><span></span><span></span><span></span></span>Alquilómetro</a>
    <nav aria-label="Navegación principal">
      <a href="#buscar" data-view="buscar">Publicaciones</a>
      <a href="#contratos" data-view="contratos">Mis contratos</a>
      <a href="#publicar" data-view="publicar" id="publish-link" hidden>Nueva publicación</a>
    </nav>
    <button id="account" class="outline">Ingresar</button>
  </div></header>
  <main id="main" tabindex="-1">
    <div class="wrap content">
      <p role="status">Cargando Alquilómetro…</p>
      <noscript><p>Para usar Alquilómetro hay que activar JavaScript.</p></noscript>
    </div>
  </main>
  <footer class="wrap footer"><strong>Alquilómetro</strong><span>Programación II · UNSAM</span></footer>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <button class="close" aria-label="Cerrar" type="button">×</button>
    <div id="dialog-body"></div>
  </dialog>
</body>
</html>
