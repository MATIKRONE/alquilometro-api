services:
  - type: web
    name: alquilometro-unsam
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./alquilometro.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_MINUTOS_EXPIRACION
        value: "120"
